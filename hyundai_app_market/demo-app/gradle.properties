android.useAndroidX=true
# Windows에서 사용자 폴더 이름에 한글이 있으면, JDK 18 이상은 Gradle이 테스트 작업자 classpath 파일을 UTF-8로 쓰고
# java 실행기는 시스템 코드 페이지(CP949)로 읽어 GradleWorkerMain을 찾지 못합니다. COMPAT은 시스템 기본 인코딩을 씁니다.
# 소스 인코딩에는 영향이 없습니다(Kotlin·javac는 UTF-8 고정). macOS·Linux에서는 시스템 기본값이 UTF-8입니다.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=COMPAT
kotlin.code.style=official
